[build-system]
requires = [
    "hatchling>=1.20",
]
build-backend = "hatchling.build"

[project]
name = "targeted-transcriptomics-training"
version = "0.1.0"
description = "Course material for targeted transcriptomics and spatial proteomics training."
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [
    { name = "VIB Spatial Catalyst" },
]
keywords = [
    "spatial-omics",
    "targeted-transcriptomics",
    "spatial-proteomics",
    "spatialdata",
    "harpy",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    # Cellpose 3.1.1.3 has stale metadata declaring numpy<2.1. The current
    # stack works with NumPy 2.4.x, which avoids StringDType plotting crashes.
    "numpy>=2.4.6",
    "numba>=0.64",
    "harpy-analysis[extra,napari]>=0.4.1",
    "harpy_vitessce @ git+https://github.com/vibspatial/harpy_vitessce.git@main",
    "napari-harpy>=0.0.7",
    "instanseg-torch @ git+https://github.com/instanseg/instanseg.git@main",
    "spatialdata==0.7.2",
    "zarr>=3.2.1",
    "squidpy",
    "cellpose==3.1.1.3",
    "jupyter",
    "mofax",
    "mofapy2",
    "bokeh",
]

[project.urls]
Homepage = "https://github.com/vibspatial/targeted_transcriptomics_training"
Repository = "https://github.com/vibspatial/targeted_transcriptomics_training"
Issues = "https://github.com/vibspatial/targeted_transcriptomics_training/issues"

[tool.hatch.build.targets.wheel]
# This repository contains notebooks and helper scripts, but no importable Python
# package directory. Build a metadata-only wheel so `pip install -e .` can use
# the project metadata and dependencies without Hatchling trying to auto-select
# package files.
bypass-selection = true

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv]
# Override Cellpose 3.1.1.3's stale numpy<2.1 requirement. This keeps the
# environment resolver aligned with the tested working stack.
override-dependencies = [
    "numpy>=2.4.6",
]

[tool.ruff]
line-length = 120
extend-include = ["*.ipynb"]
